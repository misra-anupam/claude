events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  gzip on;
  gzip_types text/css application/javascript;
  # text/event-stream deliberately absent -- gzip buffers a full response
  # before flushing, which would turn a live token stream into one delayed
  # burst at the end.

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://backend:8000/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      # SSE-critical: without these, nginx buffers the whole response before
      # forwarding it, turning a live token stream into one delayed burst.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
