services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-chatdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-chatdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Holds the Docker socket mount so untrusted code can be sandboxed in
  # sibling containers (network-disabled, read-only, resource-capped --
  # verified live during development). Deliberately isolated on the
  # `sandbox` network only (not `default`) so postgres/frontend have no path
  # to it even if compromised, and it has no path to postgres either -- the
  # backend is the sole bridge, reaching it over `sandbox` while staying on
  # `default` for Postgres + outbound OpenRouter calls.
  executor:
    build: ./executor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandbox

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      EXECUTOR_URL: http://executor:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - sandbox
    # Not published on the host -- only reachable via the frontend's nginx
    # reverse proxy (same-origin from the browser's point of view, no CORS
    # needed). Reach it directly for debugging with:
    #   docker compose exec frontend wget -qO- http://backend:8000/api/health

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Static build of the mkdocs-material documentation site (self-contained
  # under docs/: docs/mkdocs.yml + docs/docs/ content + docs/Dockerfile.docs)
  # -- built once at image-build time, served by plain nginx. No app
  # dependencies: it doesn't talk to backend/postgres/executor at all.
  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile.docs
    ports:
      - "8001:80"

networks:
  default: {}
  # internal: true -- containers whose *only* network is this one get no
  # outbound internet access either. executor doesn't need any (it just
  # drives the local Docker socket and answers backend's HTTP calls); this
  # is extra containment on top of the per-sandbox-container hardening.
  sandbox:
    internal: true

volumes:
  pgdata:
