site_name: Anupam's Claude
site_description: >-
  A LangGraph agent (Claude via OpenRouter) wrapped in FastAPI, streamed live
  to a vanilla-JS frontend over SSE -- complete project documentation.
repo_url: https://github.com/misra-anupam/claude
repo_name: misra-anupam/claude
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Streaming Design: streaming.md
  - Tools:
      - Overview: tools/index.md
      - Web Search: tools/web-search.md
      - Calculator: tools/calculator.md
      - Stock Analysis: tools/stock-analysis.md
      - Summarize Text: tools/summarize-text.md
      - Sandboxed Code Execution: tools/sandbox-exec.md
      - Charts & Diagrams: tools/charts-diagrams.md
      - Image Generation: tools/image-generation.md
      - Documents (PDF/HTML): tools/documents.md
      - Long-Term Memory: tools/memory.md
      - External MCP Servers: tools/mcp.md
  - Backend:
      - Overview: backend/index.md
      - Agent & Model: backend/agent.md
      - Resilience: backend/resilience.md
      - Conversations: backend/conversations.md
      - API Reference: backend/api-reference.md
  - Frontend: frontend.md
  - Security: security.md
  - Deployment: deployment.md
  - Troubleshooting: troubleshooting.md
  - Roadmap: roadmap.md
